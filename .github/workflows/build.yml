name: Compilar App Seguimiento CMD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compilar-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador de Windows
        run: npx electron-builder --win nsis --x64 --publish always
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publicar en Releases de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: "App Seguimiento Comercial CMD ${{ github.ref_name }}"
          body: |
            ## App Seguimiento Comercial CMD
            **Versión:** ${{ github.ref_name }}
